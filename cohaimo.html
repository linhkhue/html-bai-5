<body style="width: fit-content;">
    <h3 style="text-align: center;">CÔ HÁI MƠ</h3>
    <pre style="white-space: pre; font-family: 'Times New Roman', Times, serif;">
    <i>Thơ thẩn đường chiều một khách thơ, <br>
    Say nhìn xa rặng núi xanh lơ,</i> <br>
    Khi trời lặng lẽ và trong trẻo, <br>
    Thấp thoáng rừng mơ, <b>Cô hái mơ.</b> <br>
    <u>Tác giả:</u> <span style="text-decoration: line-through;">Vô danh</span>
    </pre>
